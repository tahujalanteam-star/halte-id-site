name: Build & Deploy halte.id

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Menaruh env di sini agar terbaca oleh langkah Build DAN langkah Cloudflare Deploy
    env:
      DATA_DIR: data-real
      SITE_URL: https://halte-id.pages.dev
      PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: tahujalanteam-star/halte-id-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data-real

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: halte-id
          directory: dist